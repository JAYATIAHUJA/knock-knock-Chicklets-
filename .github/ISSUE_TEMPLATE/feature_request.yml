name: Feature Request
description: Suggest an idea or new feature for Chicklets
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Share your ideas for new game modes, 3D props, cultural twists, or performance improvements!
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or new gameplay mechanic?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?

