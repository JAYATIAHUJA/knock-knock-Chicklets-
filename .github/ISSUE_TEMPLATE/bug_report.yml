name: Bug Report
description: Create a report to help us improve Chicklets
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please describe what happened below.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and Node version (if running locally).
      placeholder: Chrome 120, Windows 11, Node 20.19
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this?
      placeholder: |
        1. Start room with 3 players
        2. Denner knocks player A
        3. Runner calls relay name
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
    validations:
      required: true
